name: Refresh GitHub pulse

# Rebuilds src/data/github-pulse.json from every repo's git history and commits it when the
# numbers changed; that push redeploys the site on Vercel.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y tsx scripts/github-pulse.mts
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-pulse.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-pulse.json
          git commit -m "chore: refresh GitHub pulse"
          git push
